name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enable-auto-merge:
    # PR author and triggering actor must both be Dependabot (not a human/agent push to the branch).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # Fine-grained PAT (Contents, Pull requests, Workflows RW) in Dependabot secrets; merge push can trigger deploys.
      GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
    steps:
      # --auto merges after required status checks pass on main, once those checks are configured.
      - name: Enable auto-merge for Dependabot PR
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::DEPENDABOT_AUTOMERGE_TOKEN Dependabot secret is not set"; exit 1; fi
          gh pr merge --auto --squash "$PR_URL"
