name: Lab experiment PostHog status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install

      - name: Sync PostHog experiment status
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_HOST: https://us.posthog.com
          POSTHOG_PROJECT_ID: "489599"
        run: npx tsx scripts/lab/sync-posthog-experiment-status.ts

      - name: Commit status file when changed
        run: |
          if git diff --quiet lab/experiment-status.json; then
            echo "No experiment-status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/experiment-status.json
          git commit -m "chore(lab): refresh PostHog experiment status"
          git push
