name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate lab experiments registry
        run: npx tsx scripts/lab/validate-experiments.ts

      - name: Run tests
        run: npm test && npm run test:digest

      - name: Install Playwright (Lab verify gates)
        run: npx --yes playwright@1.64.1 install chromium

      - name: Genesis verification (verify:genesis)
        run: npm run verify:genesis
        env:
          POSTHOG_KEY: phc_ci_lab_analytics_gate_only
          DIGEST_AS_OF_DATE: "2026-10-19"
