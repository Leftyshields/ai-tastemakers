name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "data/subscribers.json"
      - "data/tool-inventory.json"
      - "data/experiments/*.json"
      - "scripts/build-pages.ts"
      - "scripts/edition-pages.ts"
      - "scripts/lab/render-token-usage.ts"
      - "scripts/lab/aggregate-token-usage.ts"
      - "scripts/lab/aggregate-experiments.ts"
      - "scripts/lab/experiments.js"
      - "scripts/lab/validate-experiments.ts"
      - "scripts/lab/build-lab-public.ts"
      - "lab/experiments.json"
      - "lab/experiment-status.json"
      - "scripts/seo-helpers.ts"
      - "scripts/generate-brief-og.ts"
      - "scripts/og-theme.ts"
      - "scripts/index-layout-helpers.ts"
      - "firebase/**"
      - "site/assets/**"
      - "site/google65a429d15bd1a67c.html"
      - "scripts/site-verification-pages.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build:pages
        env:
          FIREBASE_PROJECT_ID: epiphoric-prod
          FIREBASE_AUTH_DOMAIN: epiphoric-prod.firebaseapp.com
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          # EXP-20260701-landing-layout treatment (2026-08-01 → 2026-08-14)
          SITE_LANDING_LAYOUT_V2: "1"

      - name: Verify CSS artifact
        run: |
          css="$(find site/assets -maxdepth 1 -name 'style.*.css' ! -name 'style.css.json' | head -1)"
          test -n "$css" && test -s "$css" && test "$(wc -c < "$css")" -gt 1000
          test -f site/assets/style.css.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Cancel stuck Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments" --paginate -q '.[] | select(.status=="queued" or .status=="in_progress" or .status=="deployment_queued") | .id')
          if [ -z "$ids" ]; then
            echo "No stuck Pages deployments found."
            exit 0
          fi
          for id in $ids; do
            echo "Cancelling Pages deployment ${id}..."
            gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel" -X POST || true
          done
          echo "Waiting 60s for cancellation to propagate..."
          sleep 60

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
        with:
          timeout: 900000

      - name: Wait before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Retry Pages deployment (attempt 2)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
        with:
          timeout: 900000

      - name: Wait before Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 90

      - name: Retry Pages deployment (attempt 3)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_retry_2
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
        with:
          timeout: 900000

      - name: Fail if Pages deployment did not succeed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after three attempts."
          echo "If a deployment is still stuck, cancel it under Settings → Pages → Deployments, then re-run."
          exit 1
